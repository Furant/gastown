services:
  console:
    build: .
    ports:
      - "127.0.0.1:8770:8770"
    environment:
      DATABASE_URL: "postgresql://console:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/console"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: console
      POSTGRES_DB: console
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - console_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
volumes:
  console_database:
